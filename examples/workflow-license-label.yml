# Copy to .github/workflows/license-label.yml in your app's repository.
name: Licence label
on:
  pull_request:
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/yarn.lock"
      - "**/pnpm-lock.yaml"
      - "**/requirements*.txt"
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/poetry.lock"
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Justusability/license-label@v0
        with:
          fail-above: "3"
